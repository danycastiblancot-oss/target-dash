<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Dash - Juego de Precisión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="game-container">
        <header class="game-header">
            <h1 class="game-title">Target Dash</h1>
            <div class="stats-board">
                <div class="stat-box">
                    <span class="stat-label">Puntaje</span>
                    <span id="score-display" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Racha</span>
                    <span id="streak-display" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Tiempo</span>
                    <span id="timer-display" class="stat-value">30s</span>
                </div>
            </div>
        </header>

        <section id="game-board" class="game-board">
            <div id="overlay-screen" class="overlay-screen">
                <h2 id="overlay-title" class="overlay-title">¡Desafío de Precisión!</h2>
                <p id="overlay-msg" class="overlay-msg">Haz clic en el objetivo antes de que desaparezca.</p>
                <button id="btn-start" class="btn-action">Iniciar Juego</button>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
